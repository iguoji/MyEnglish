name: Build and publish Android release

on:
  # 兼容原来的 latest 标签，同时支持 v0.22.9 这类正式版本标签。
  push:
    tags:
      - latest
      - 'v*'

  # 允许在 Actions 页面手动触发构建流程。
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release 标签（latest 或 vX.Y.Z）
        required: true
        default: latest

# 发布 Release 需要写入仓库内容的权限。
permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build Android release APK
    runs-on: ubuntu-latest

    steps:
      # 把触发本次流程的提交取到构建机中。
      - name: Checkout source code
        uses: actions/checkout@v4

      # 解析 pubspec 版本，并保证 v 标签与安装包版本完全一致。
      - name: Resolve and validate release version
        id: release_metadata
        working-directory: my_english
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          # Flutter 版本必须同时包含三段版本名和正整数构建号，例如 0.22.9+9。
          package_version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+)[[:space:]]*$/\1/p' pubspec.yaml | head -n 1)"
          if [[ ! "$package_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[1-9][0-9]*$ ]]; then
            printf '::error::pubspec.yaml 的 version 必须使用 X.Y.Z+N 格式，当前为：%s\n' "$package_version"
            exit 1
          fi

          version_name="${package_version%%+*}"
          build_number="${package_version##*+}"
          expected_version_tag="v$version_name"

          # 手动触发同样只接受 latest 或标准 v 版本，避免误建难以识别的 Release。
          if [[ "$REQUESTED_TAG" != "latest" && ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf '::error::发布标签必须是 latest 或 vX.Y.Z，当前为：%s\n' "$REQUESTED_TAG"
            exit 1
          fi

          # v 标签就是本次公开版本名，必须与 pubspec 的 X.Y.Z 部分完全相等。
          if [[ "$REQUESTED_TAG" == v* && "$REQUESTED_TAG" != "$expected_version_tag" ]]; then
            printf '::error::标签 %s 与 pubspec 版本 %s 不一致，应使用标签 %s。\n' \
              "$REQUESTED_TAG" "$package_version" "$expected_version_tag"
            exit 1
          fi

          # 输出供重命名 APK 和发布 Release 的后续步骤使用。
          apk_name="MyEnglish-${expected_version_tag}-build${build_number}.apk"
          release_title="MyEnglish ${expected_version_tag} (Build ${build_number})"
          printf 'release_tag=%s\n' "$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          printf 'version_name=%s\n' "$version_name" >> "$GITHUB_OUTPUT"
          printf 'build_number=%s\n' "$build_number" >> "$GITHUB_OUTPUT"
          printf 'apk_name=%s\n' "$apk_name" >> "$GITHUB_OUTPUT"
          printf 'release_title=%s\n' "$release_title" >> "$GITHUB_OUTPUT"

      # 项目的 Gradle 配置使用 Java 17，Android 构建必须保持这个版本一致。
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 使用项目当前开发环境对应的 Flutter 版本。
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      # 将 GitHub Secrets 中的正式签名文件临时恢复到构建机。
      # Secrets 是 GitHub 提供的加密变量，不会写入仓库，也不会作为构建产物上传。
      - name: Restore Android signing files
        working-directory: my_english/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          # 收集所有缺失项并一次性显示名称，方便直接在 GitHub 仓库设置中补齐。
          missing_secrets=()
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || missing_secrets+=(ANDROID_KEYSTORE_BASE64)
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || missing_secrets+=(ANDROID_KEYSTORE_PASSWORD)
          [ -n "$ANDROID_KEY_ALIAS" ] || missing_secrets+=(ANDROID_KEY_ALIAS)
          [ -n "$ANDROID_KEY_PASSWORD" ] || missing_secrets+=(ANDROID_KEY_PASSWORD)

          # 只显示变量名称，不会把签名文件、别名或密码写入 Actions 日志。
          if [ "${#missing_secrets[@]}" -gt 0 ]; then
            printf '::error::缺少 GitHub Actions Secrets：%s\n' "${missing_secrets[*]}"
            printf '请前往仓库 Settings > Secrets and variables > Actions 添加上述 Repository secrets。\n'
            exit 1
          fi

          # 把 keystore 放在 Runner 临时目录，避免 Flutter 刷新 Android 工程时影响签名文件。
          # 先解码到临时文件，再原子替换，避免留下半截 keystore。
          keystore_path="$RUNNER_TEMP/myenglish-upload-keystore.jks"
          temporary_keystore="$keystore_path.tmp"
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$temporary_keystore"; then
            rm -f "$temporary_keystore"
            printf '::error::ANDROID_KEYSTORE_BASE64 不是有效的 Base64 内容。\n'
            exit 1
          fi
          test -s "$temporary_keystore"
          mv "$temporary_keystore" "$keystore_path"

          # 提前验证 keystore 密码和别名，避免等到 Gradle 构建时才出现模糊错误。
          if ! keytool -list \
            -keystore "$keystore_path" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" > /dev/null; then
            printf '::error::无法读取 Android keystore，请检查 Base64、keystore 密码和 key alias。\n'
            exit 1
          fi

          # build.gradle.kts 会从当前目录读取这个签名配置文件。
          printf '%s\n' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "storeFile=$keystore_path" > key.properties

          # 在进入 Gradle 前再次确认两个签名输入都存在，错误会更容易定位。
          test -s key.properties
          test -s "$keystore_path"

      # 安装 Dart 依赖。
      - name: Install Flutter dependencies
        working-directory: my_english
        run: flutter pub get

      # app_info.dart 负责应用内版本展示；必须和 pubspec 单一数据源保持同步。
      - name: Verify generated app metadata
        working-directory: my_english
        run: |
          set -euo pipefail
          dart run tools/sync_app_info.dart
          if ! git diff --exit-code -- lib/common/app_info.dart; then
            printf '::error::应用内版本信息未同步，请在 my_english 目录执行 dart run tools/sync_app_info.dart 后提交结果。\n'
            exit 1
          fi

      # 生成使用正式签名的 Android Release APK。
      - name: Build release APK
        working-directory: my_english
        run: |
          set -euo pipefail

          # 读取 Gradle 即将使用的实际路径，并在构建前最后确认 keystore 没有消失。
          keystore_path="$(sed -n 's/^storeFile=//p' android/key.properties | tail -n 1)"
          if [ -z "$keystore_path" ] || [ ! -s "$keystore_path" ]; then
            printf '::error::构建前找不到 Android keystore：%s\n' "$keystore_path"
            exit 1
          fi

          flutter build apk --release

      # 使用稳定、易识别的文件名，便于用户在 Release 页面下载。
      - name: Rename APK
        working-directory: my_english
        env:
          APK_NAME: ${{ steps.release_metadata.outputs.apk_name }}
        run: cp build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"

      # 创建或更新对应标签的 Release，并将带版本名的 APK 作为公开下载附件上传。
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_metadata.outputs.release_tag }}
          name: ${{ steps.release_metadata.outputs.release_title }}
          body: |
            MyEnglish Android Release

            版本：v${{ steps.release_metadata.outputs.version_name }}
            构建号：${{ steps.release_metadata.outputs.build_number }}

            本版本由 GitHub Actions 自动构建。
          files: my_english/${{ steps.release_metadata.outputs.apk_name }}
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
