name: Build and publish latest release

on:
  # 只有推送名称恰好为 latest 的标签时，才自动发布一个版本。
  push:
    tags:
      - latest

  # 允许在 Actions 页面手动触发构建流程。
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub Release 使用的标签名称
        required: true
        default: latest

# 发布 Release 需要写入仓库内容的权限。
permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build Android release APK
    runs-on: ubuntu-latest

    steps:
      # 把触发本次流程的提交取到构建机中。
      - name: Checkout source code
        uses: actions/checkout@v4

      # 项目的 Gradle 配置使用 Java 17，Android 构建必须保持这个版本一致。
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 使用项目当前开发环境对应的 Flutter 版本。
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      # 安装 Dart 依赖。
      - name: Install Flutter dependencies
        working-directory: my_english
        run: flutter pub get

      # 生成 Android Release APK（使用默认的 Debug 证书进行通用签名）。
      - name: Build release APK
        working-directory: my_english
        run: flutter build apk --release

      # 使用稳定、易识别的文件名，便于用户在 Release 页面下载。
      - name: Rename APK
        working-directory: my_english
        run: cp build/app/outputs/flutter-apk/app-release.apk MyEnglish-latest.apk

      # 创建或更新 latest Release，并将 APK 作为公开下载附件上传。
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || 'latest' }}
          name: MyEnglish latest
          body: |
            MyEnglish Android Release

            本版本由 GitHub Actions 自动构建。
          files: my_english/MyEnglish-latest.apk
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}