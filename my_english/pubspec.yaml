name: my_english
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  tabler_icons_plus: ^3.44.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # 页面图标全部来自 tabler_icons_plus，因此不再打包 Flutter 内置 Material Icons 字体。
  uses-material-design: false
  # 目录声明类似小程序把静态资源放进项目；其中的 words.json 会进入真机安装包。
  assets:
    - assets/data/
