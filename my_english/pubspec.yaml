name: my_english
description: "MyEnglish: a personal English vocabulary app with built-in word library, pronunciation settings, and daily review goals."
publish_to: 'none'
version: 0.22.2+6

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Tabler 图标包直接随项目保存，避免 VPN 或 pub.dev 网络异常导致项目无法启动。
  tabler_icons_plus:
    # path 类似 PHP Composer 的本地仓库引用，不需要联网下载。
    path: third_party/tabler_icons_plus
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 构建期同步脚本直接导入 package:path，必须声明为本项目的直接开发依赖。
  path: ^1.9.1

flutter:
  # Flutter 框架内部组件（TextField 清除按钮等）仍引用 MaterialIcons，
  # 设为 true 让 tree-shaker 只裁剪实际用到的字形，体积影响可忽略。
  uses-material-design: true
  # 抽屉顶部品牌 logo（来自 logo/_source/master_1024.png，C3 翻页书页方案）。
  # 修改 logo 后只需替换文件，无需改代码。
  assets:
    - assets/logo/app_logo.png
