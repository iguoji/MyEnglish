name: my_english
description: "A new Flutter project."
publish_to: 'none'
version: 0.11.1+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Tabler 图标包直接随项目保存，避免 VPN 或 pub.dev 网络异常导致项目无法启动。
  tabler_icons_plus:
    # path 类似 PHP Composer 的本地仓库引用，不需要联网下载。
    path: third_party/tabler_icons_plus
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # 页面图标全部来自 tabler_icons_plus，因此不再打包 Flutter 内置 Material Icons 字体。
  uses-material-design: false
