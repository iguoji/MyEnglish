<script>
/* ============ Tabler 风格内联图标 ============ */
const SVG = (p, inner) => `<svg xmlns="http://www.w3.org/2000/svg" width="${p.size||24}" height="${p.size||24}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const icons = {
  chevronLeft: (s={}) => SVG(s,'<path d="M13 6l-6 6l6 6"/>'),
  backspace: (s={}) => SVG(s,'<path d="M20 6a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-11l-5 -6l5 -6z"/><path d="M12 10l4 4m0 -4l-4 4"/>'),
};
document.getElementById('ic-back').innerHTML = icons.chevronLeft({size:22});

/* ============ 工具 ============ */
const $ = (id)=>document.getElementById(id);
const fmt = (t)=>{const m=String(Math.floor(t/60)).padStart(2,'0');const s=String(Math.floor(t%60)).padStart(2,'0');return `${m}:${s}`;};

/* ============ 计时（顶部演示） ============ */
const state = { seconds:0, typed:[] };
setInterval(()=>{ state.seconds++; $('timer').textContent = fmt(state.seconds); }, 1000);

/* ============ 已输入预览 ============ */
function renderTyped(){
  const box=$('typed'); box.innerHTML='';
  if(state.typed.length===0){
    box.innerHTML='<span class="text-[13px] text-tb-muted/70">（空）</span>';
    return;
  }
  state.typed.forEach(ch=>{
    const s=document.createElement('span');
    s.className='chip-pop grid h-9 min-w-[32px] place-items-center rounded-lg bg-tb-surface px-2 text-[18px] font-semibold text-tb-ink tabular-nums';
    s.textContent=ch;
    box.appendChild(s);
  });
}

/* ============ 键盘构建（基于 听音拼写1.html，去掉工具条，删除键并入 zxcvbnm） ============ */
function buildKeyboard(){
  const rows=['qwertyuiop','asdfghjkl','zxcvbnm'];
  const box=$('keyRows'); box.innerHTML='';
  rows.forEach((row,r)=>{
    const div=document.createElement('div');
    div.className='flex justify-center gap-[5px]';
    // 第二行两侧内缩 5%，形成经典错落键盘形状（沿用 听音拼写1.html）
    if(r===1) div.style.paddingInline='5%';
    row.split('').forEach(k=>{
      const b=document.createElement('button');
      b.type='button'; b.dataset.key=k;
      b.className='key h-[46px] flex-1 rounded-[9px] bg-tb-key text-[17px] font-medium text-tb-ink uppercase';
      b.textContent=k;
      b.onclick=()=>handleLetter(k);
      div.appendChild(b);
    });
    // 第三行：删除键直接作为 zxcvbnm 的「第 8 个等宽键」，整行水平居中
    if(r===2){
      const del=document.createElement('button');
      del.type='button'; del.dataset.key='Backspace'; del.setAttribute('aria-label','删除');
      del.className='key key-del grid h-[46px] flex-1 place-items-center rounded-[9px] bg-[#ccd4de] text-tb-body';
      del.innerHTML=icons.backspace({size:21});
      let holdT, holdI;
      const start=()=>{ clearTimeout(holdT); clearInterval(holdI); holdT=setTimeout(()=>{ holdI=setInterval(handleDelete,90); },420); };
      const stop=()=>{ clearTimeout(holdT); clearInterval(holdI); };
      del.onpointerdown=start; del.onpointerup=stop; del.onpointerleave=stop; del.onpointercancel=stop;
      del.onclick=handleDelete;
      div.appendChild(del);
    }
    box.appendChild(div);
  });
}

/* ============ 输入逻辑 ============ */
function flashKey(k){
  document.querySelectorAll('.key').forEach(b=>{ if(b.dataset.key===k) b.classList.add('key-active'); });
  setTimeout(()=>{ document.querySelectorAll('.key').forEach(b=>b.classList.remove('key-active')); }, 130);
}
function handleLetter(letter){
  flashKey(letter);
  state.typed.push(letter);
  renderTyped();
}
function handleDelete(){
  flashKey('Backspace');
  if(state.typed.length===0) return;
  state.typed.pop();
  renderTyped();
}

/* ============ 交互绑定 ============ */
$('backBtn').onclick = ()=>{ /* 框架页：此处接入退出确认 */ };

// 物理键盘
window.addEventListener('keydown',(e)=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(/^[a-zA-Z]$/.test(e.key)){ e.preventDefault(); handleLetter(e.key.toLowerCase()); }
  else if(e.key==='Backspace'){ e.preventDefault(); handleDelete(); }
});

/* ============ 初始化 ============ */
renderTyped();
buildKeyboard();
</script>
