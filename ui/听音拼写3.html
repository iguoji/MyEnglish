  {text:"thrive",phonetic:"/θraɪv/",meanings:[{pos:"v.",zh:"茁壮成长；兴旺"}]},
  {text:"utter",phonetic:"/ˈʌt̬.ɚ/",meanings:[{pos:"v.",zh:"说出；发出"},{pos:"adj.",zh:"完全的；彻底的"}]},
  {text:"venture",phonetic:"/ˈven.tʃər/",meanings:[{pos:"n.",zh:"冒险；风险投资"},{pos:"v.",zh:"冒险；敢于"}]},
  {text:"whisper",phonetic:"/ˈwɪs.pər/",meanings:[{pos:"v.",zh:"低语；私语"},{pos:"n.",zh:"耳语；传闻"}]},
  {text:"youthful",phonetic:"/ˈjuːθ.fəl/",meanings:[{pos:"adj.",zh:"年轻的；朝气蓬勃的"}]},
  {text:"zenith",phonetic:"/ˈziː.nɪθ/",meanings:[{pos:"n.",zh:"顶点；天顶；全盛期"}]},
];
const TOTAL=WORDS.length;
document.getElementById('totNum').textContent=TOTAL;
document.getElementById('smTotal').textContent=TOTAL;

/* ===== 状态 ===== */
let index=0, typed='', status='idle', seconds=0, playing=false, revealed=false;
let wrongCount=0, correctFirstTry=0, attemptWrong=false, finished=false;
let playTimer=null, autoTimer=null;
const $=id=>document.getElementById(id);
const word=()=>WORDS[Math.min(index,TOTAL-1)];
const pad=n=>String(n).padStart(2,'0');
const fmtTime=t=>`${pad(Math.floor(t/60))}:${pad(t%60)}`;

/* ===== 计时 ===== */
setInterval(()=>{ if(finished) return; seconds++; $('timer').textContent=fmtTime(seconds); },1000);

/* ===== 发音 ===== */
function setPlaying(on){ playing=on; updatePronounce(); }
function play(text){
  text=text||word().text;
  if(playTimer) clearTimeout(playTimer);
  setPlaying(true);
  let ended=false;
  const stop=()=>{ if(ended) return; ended=true; setPlaying(false); };
  if('speechSynthesis' in window){
    try{ window.speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.9; u.onend=stop; u.onerror=stop; window.speechSynthesis.speak(u);}catch(e){}
  }
  playTimer=setTimeout(stop,1600);
}
function autoPlay(){ if(autoTimer) clearTimeout(autoTimer); autoTimer=setTimeout(()=>play(word().text),350); }

/* ===== 字母格尺寸（随词长自适应，与原稿一致） ===== */
function slotMetrics(len){
  const w = len<=7?40:len<=9?34:len<=11?28:24;
  const f = len<=7?30:len<=9?26:len<=11?22:19;
  return {w,f};
}

/* ===== 渲染：字母槽 ===== */
function renderSlots(){
  const w=word(); const len=w.text.length; const {w:slotW,f:fontSize}=slotMetrics(len);
  const box=$('slots');
  box.className = status==='wrong' ? 'flex items-end justify-center gap-[6px] animate-shake' : 'flex items-end justify-center gap-[6px]';
  let html='';
  for(let i=0;i<len;i++){
    const ch=typed[i];
    const isCaret = status==='idle' && i===typed.length;
    const showHint = revealed && !ch;
    let letterHtml='';
    if(ch){
      const col = status==='correct'?'text-tb-success':status==='wrong'?'text-tb-danger':'text-tb-text';
      letterHtml=`<span class="animate-letter-pop lowercase ${col}">${ch}</span>`;
    } else if(showHint){
      letterHtml=`<span class="lowercase text-tb-border">${w.text[i]}</span>`;
    }
    let lineCls='h-[3px] w-full rounded-full transition-colors duration-200 ';
    if(status==='correct') lineCls+='bg-tb-success';
    else if(status==='wrong') lineCls+='bg-tb-danger';
    else lineCls += isCaret ? 'bg-tb-primary animate-caret' : (ch?'bg-tb-text':'bg-tb-border');
    html+=`<div class="relative flex flex-col items-center" style="width:${slotW}px;">
      <div class="flex h-[46px] items-end justify-center pb-1 font-semibold leading-none tracking-tight lowercase" style="font-size:${fontSize}px;">${letterHtml}</div>
      <div class="${lineCls}"></div>
    </div>`;
  }
  box.innerHTML=html;
}

/* ===== 渲染：标签 ===== */
function renderLabel(){
  const dot=$('labelDot'), txt=$('labelText');
  if(status==='correct'){ dot.className='h-1.5 w-1.5 rounded-full bg-tb-success transition-colors'; txt.textContent='Correct'; }
  else if(status==='wrong'){ dot.className='h-1.5 w-1.5 rounded-full bg-tb-danger transition-colors'; txt.textContent='Try again'; }
  else { dot.className='h-1.5 w-1.5 rounded-full bg-tb-primary transition-colors'; txt.textContent=`Spell it · ${word().text.length} letters`; }
}

/* ===== 渲染：释义 ===== */
function renderMeanings(){
  const w=word();
  $('senseList').innerHTML = w.meanings.map((m,i)=>`
    <li class="flex animate-fade-up items-start gap-3 py-3 first:pt-0 last:pb-0" style="animation-delay:${i*60}ms;animation-fill-mode:both;">
      <span class="mt-[2px] inline-flex h-5 min-w-[34px] shrink-0 items-center justify-center rounded bg-tb-primary-lt px-1.5 text-[11px] font-semibold italic text-tb-primary">${m.pos}</span>
      <span class="text-[15px] leading-6 text-tb-text">${m.zh}</span>
    </li>`).join('');
}

/* ===== 渲染：发音按钮（仅播放状态变化时更新，避免均衡器动画重放） ===== */
function updatePronounce(){
  const circle=$('pronCircle'), inner=$('pronInner'), rings=$('pronRings'), us=$('pronUs');
  const usColor='rgba(32,107,196,0.7)';
  if(playing){
    circle.className='relative flex h-10 w-10 items-center justify-center rounded-full bg-tb-primary text-white shadow-[0_6px_16px_-4px_rgba(32,107,196,0.55)] transition-all duration-300';
    const BARS=[0.55,0.85,1,0.7,0.45];
    inner.innerHTML=`<span class="flex h-4 items-center gap-[2.5px]">${BARS.map((h,i)=>`<span class="w-[2.5px] animate-eq rounded-full bg-white" style="height:${h*16}px;transform-origin:center;animation-delay:${i*0.11}s"></span>`).join('')}</span>`;
    // 涟漪环用显式 rgba，避免动态 Tailwind 透明度类不生效
    rings.innerHTML=`<span class="absolute inset-0 animate-ring rounded-full" style="background-color:rgba(32,107,196,0.30)"></span><span class="absolute inset-0 animate-ring rounded-full" style="background-color:rgba(32,107,196,0.20);animation-delay:0.45s"></span>`;
    us.textContent='US · Playing';
    us.style.color=usColor;
  } else {
    circle.className='relative flex h-10 w-10 items-center justify-center rounded-full bg-tb-primary-lt text-tb-primary transition-all duration-300';
    inner.innerHTML=icVolume;
    rings.innerHTML='';
    us.textContent='US · Tap to play';
    us.style.color=usColor;
  }
}

/* ===== 渲染：顶部进度 ===== */
function renderTop(){
  $('curNum').textContent=index+1;
  const percent=Math.min(100,((index+1)/TOTAL)*100);
  $('progressBar').style.width=Math.max(2,percent)+'%';
  $('progressDot').style.left=Math.max(2,percent)+'%';
  $('phonetic').textContent=word().phonetic;
}

/* ===== 输入逻辑 ===== */
function handleKey(l){
  if(status!=='idle'||finished) return;
  if(typed.length>=word().text.length) return;
  typed+=l;
  renderSlots(); renderLabel();
  if(typed.length===word().text.length) evaluate();
}
function handleDelete(){
  if(status!=='idle'||finished) return;
  typed=typed.slice(0,-1);
  renderSlots(); renderLabel();
}
function evaluate(){
  if(typed.length!==word().text.length) return;
  if(typed===word().text){
    status='correct';
    if(!attemptWrong) correctFirstTry++;
    play(word().text);
    renderSlots(); renderLabel();
    setTimeout(()=>{
      if(index+1>=TOTAL){ finished=true; showSummary(); return; }
      index++; typed=''; status='idle'; revealed=false; attemptWrong=false;
      renderTop(); renderSlots(); renderLabel(); renderMeanings(); autoPlay();
    },900);
  } else {
    status='wrong'; wrongCount++; attemptWrong=true;
    renderSlots(); renderLabel();
    setTimeout(()=>{ typed=''; status='idle'; renderSlots(); renderLabel(); },650);
  }
}
function reveal(){
  if(status!=='idle') return;
  revealed=true; attemptWrong=true; renderSlots();
  setTimeout(()=>{ revealed=false; renderSlots(); },1800);
}
function restart(){
  index=0; typed=''; status='idle'; seconds=0; revealed=false; wrongCount=0; correctFirstTry=0; attemptWrong=false; finished=false;
  $('summary').classList.add('hidden'); $('summary').classList.remove('flex');
  renderTop(); renderSlots(); renderLabel(); renderMeanings(); autoPlay();
}

/* ===== 完成小结 ===== */
function showSummary(){
  const acc=Math.round((correctFirstTry/TOTAL)*100);
  $('smTime').textContent=fmtTime(seconds);
  $('smAcc').textContent=acc+'%';
  $('smWrong').textContent=wrongCount;
  $('summary').classList.remove('hidden'); $('summary').classList.add('flex');
}

/* ===== 键盘（20 列网格） ===== */
function buildKeyboard(){
  const rows=['qwertyuiop','asdfghjkl','zxcvbnm'];
  const box=$('keyboard');
  const keyBase='no-select flex h-[46px] items-center justify-center rounded-[7px] border border-tb-border/70 text-[19px] font-medium text-tb-text shadow-[0_1px_0_0_rgba(29,39,59,0.12)] transition-[transform,background-color] duration-75 active:translate-y-px active:bg-tb-border-lt active:shadow-none';
  let html=`<div style="display:grid;grid-template-columns:repeat(20,1fr);column-gap:5px;row-gap:8px;">`;
  rows.forEach((row,r)=>{
    const offset=r===1?1:r===2?3:0;
    row.split('').forEach((l,i)=>{
      const gc=i===0?`grid-column:${offset+1} / span 2;`:'grid-column:span 2;';
      html+=`<button type="button" data-key="${l}" class="${keyBase} col-span-2 bg-tb-key" style="${gc}">${l}</button>`;
    });
  });
  html+=`<button type="button" aria-label="删除" data-del="1" class="${keyBase} col-span-3 bg-tb-key-dark text-tb-text" style="grid-column:18 / span 3;">${icBackspace}</button>`;
  html+=`</div>`;
  box.innerHTML=html;

  // 绑定
  let repeatT=null, repeatI=null;
  const stop=()=>{ if(repeatT) clearTimeout(repeatT); if(repeatI) clearInterval(repeatI); repeatT=repeatI=null; };
  const start=()=>{ handleDelete(); repeatT=setTimeout(()=>{ repeatI=setInterval(handleDelete,70); },420); };
  box.querySelectorAll('button[data-key]').forEach(b=> b.onclick=()=>handleKey(b.dataset.key));
  const delBtn=box.querySelector('button[data-del]');
  delBtn.onpointerdown=(e)=>{ e.preventDefault(); start(); };
  delBtn.onpointerup=stop; delBtn.onpointerleave=stop; delBtn.onpointercancel=stop;
}

/* ===== 物理键盘 ===== */
window.addEventListener('keydown',(e)=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(/^[a-zA-Z]$/.test(e.key)){ e.preventDefault(); handleKey(e.key.toLowerCase()); }
  else if(e.key==='Backspace'){ e.preventDefault(); handleDelete(); }
});

/* ===== 绑定 ===== */
$('pronounceBtn').onclick=()=>play(word().text);
$('hintBtn').onclick=reveal;
$('smRestart').onclick=restart;
$('backBtn').onclick=()=>{ if(window.history.length>1) history.back(); };

/* ===== 初始化 ===== */
updatePronounce();
renderTop();
renderSlots();
renderLabel();
renderMeanings();
buildKeyboard();
autoPlay();
</script>
</body>
</html>
